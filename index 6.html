<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e9ea">
<title>Nous deux</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6e9ea;--card:#fffaf8;--ink:#3a2a2e;--muted:#8a7479;--accent:#d9576f;--accent-soft:#f3c9d1;--line:#ecd8db}
@media (prefers-color-scheme:dark){:root{--bg:#1e1719;--card:#2a2023;--ink:#f4e6e8;--muted:#b49ca1;--accent:#ee7b91;--accent-soft:#5a2f38;--line:#3b2d31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 16px 60px}
main{max-width:520px;margin:0 auto}
h1{font-size:28px;margin:12px 0 4px}
h2{font-size:18px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0 12px}
textarea{min-height:70px;resize:vertical}
button{font:inherit;border:0;border-radius:999px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:600;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.small{width:auto;padding:8px 14px;font-size:14px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{background:var(--accent-soft);color:var(--ink)}
.tabs button.on{background:var(--accent);color:#fff}
.emojis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.emojis button{background:var(--bg);font-size:30px;padding:10px 0;border:2px solid transparent;border-radius:14px}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:14px}
.slider b{color:var(--accent)}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--accent);height:28px}
.bubble{border-radius:16px;padding:10px 14px;margin:8px 0}
.bubble small{display:block;font-weight:700;color:var(--muted);margin-bottom:2px}
.bubble.me{background:var(--accent-soft)}
.bubble.them{background:var(--bg);border:1px solid var(--line)}
.big{font-size:48px;text-align:center}
.bar{display:grid;grid-template-columns:1fr auto;font-size:14px;margin:8px 0}
.bar i{grid-column:1/-1;height:8px;border-radius:8px;background:var(--line);position:relative;overflow:hidden;margin-top:3px}
.bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);border-radius:8px}
code{word-break:break-all;background:var(--bg);padding:6px 8px;border-radius:8px;display:block;margin:8px 0;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>

<section id="view-auth" hidden>
  <h1>Nous deux 💞</h1>
  <p class="muted">Notre petit journal de couple.</p>
  <div class="card">
    <div class="tabs"><button id="t-login" class="on" onclick="setMode('login')">Connexion</button><button id="t-signup" onclick="setMode('signup')">Inscription</button></div>
    <div id="name-row" hidden><label>Prénom<input type="text" id="name" autocomplete="given-name"></label></div>
    <label>Email<input type="email" id="email" autocomplete="email"></label>
    <label>Mot de passe<input type="password" id="pw" autocomplete="current-password"></label>
    <button id="auth-btn" onclick="doAuth()">Se connecter</button>
  </div>
</section>

<section id="view-couple" hidden>
  <h1>Relier vos comptes</h1>
  <div class="card">
    <h2>Je commence</h2>
    <p class="muted">Crée votre couple, puis envoie le code à l'autre.</p>
    <button onclick="createCouple()">Créer notre couple</button>
  </div>
  <div class="card">
    <h2>J'ai reçu un code</h2>
    <input type="text" id="join-code" placeholder="Colle le code ici">
    <button onclick="joinCouple()">Rejoindre</button>
  </div>
  <button class="ghost" onclick="logout()">Se déconnecter</button>
</section>

<section id="view-main" hidden>
  <div class="row"><h1 id="hello"></h1><button class="small ghost" onclick="loadMain()">↻</button></div>
  <p class="muted" id="date-label"></p>

  <div class="card" id="waiting" hidden>
    <h2>En attente de ton ou ta partenaire</h2>
    <p class="muted">Envoie-lui ce code pour qu'il ou elle vous rejoigne :</p>
    <code id="couple-code"></code>
    <button class="small" onclick="copyCode()">Copier le code</button>
  </div>

  <div class="card">
    <h2>Ma journée</h2>
    <div class="emojis" id="emojis"></div>
    <label>Qu'est-ce que j'ai fait aujourd'hui ?<textarea id="fait"></textarea></label>
    <label>Comment je me sens ?<textarea id="ressens"></textarea></label>
    <button onclick="saveDay()">Enregistrer ma journée</button>
  </div>

  <div class="card">
    <h2>Question du jour 💬</h2>
    <p id="q-text"></p>
    <div id="q-form" hidden><textarea id="q-input" placeholder="Ta réponse…"></textarea><button onclick="answerQuestion()">Répondre</button></div>
    <div id="q-answers"></div>
  </div>

  <div class="card">
    <h2>Mes envies</h2>
    <div id="sliders"></div>
    <button onclick="saveEnvies()">Enregistrer mes envies</button>
  </div>

  <div class="card" id="partner" hidden>
    <h2 id="p-title"></h2>
    <div id="p-body"></div>
  </div>

  <button class="ghost" onclick="logout()">Se déconnecter</button>
</section>

</main>
<div id="toast"></div>

<script>
const sb = supabase.createClient('https://zzafelkwytdqmbsadpeo.supabase.co', 'sb_publishable_j4kpcrCVq14t57nvIT5s5g_yTYglTJi');
const EMOJIS = ['🥰','😄','🙂','😐','😕','😢','😡','😴'];
const ENVIES = [['calins','Envie de câlins'],['faim','Faim'],['fatigue','Fatigue'],['sortir','Envie de sortir'],['parler','Envie de parler'],['calme','Besoin de calme'],['stress','Niveau de stress'],['film','Envie d\'un film ensemble'],['cuisiner','Envie de cuisiner'],['motivation','Motivation'],['amis','Envie de voir des amis']];
const $ = id => document.getElementById(id);
const today = () => new Date().toLocaleDateString('sv-SE');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, profile = null, partner = null, selectedEmoji = null, question = null, mode = 'login';

function show(v){ ['auth','couple','main'].forEach(x => $('view-' + x).hidden = x !== v); }
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('auth'); return; }
  me = session.user;
  await loadProfile();
}

function setMode(m){
  mode = m;
  $('name-row').hidden = m !== 'signup';
  $('auth-btn').textContent = m === 'signup' ? 'Créer mon compte' : 'Se connecter';
  $('t-login').classList.toggle('on', m === 'login');
  $('t-signup').classList.toggle('on', m === 'signup');
}

async function doAuth(){
  const email = $('email').value.trim(), password = $('pw').value;
  if (!email || !password) return toast('Email et mot de passe ?');
  if (mode === 'signup') {
    const name = $('name').value.trim();
    if (!name) return toast('Ton prénom ?');
    if (password.length < 6) return toast('Mot de passe : 6 caractères minimum');
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name }, emailRedirectTo: location.origin + location.pathname } });
    if (error) return toast(error.message);
    if (!data.session) { toast('Confirme ton compte dans tes mails 📧'); setMode('login'); return; }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return toast('Email ou mot de passe incorrect');
  }
  init();
}

async function logout(){ await sb.auth.signOut(); me = profile = partner = null; show('auth'); }

async function loadProfile(){
  let { data } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  if (!data) {
    const name = me.user_metadata?.display_name || me.email.split('@')[0];
    const r = await sb.from('profiles').insert({ id: me.id, display_name: name }).select().single();
    if (r.error) return toast(r.error.message);
    data = r.data;
  }
  profile = data;
  if (!profile.couple_id) { show('couple'); return; }
  await loadMain();
}

async function createCouple(){
  const { error } = await sb.rpc('create_couple');
  if (error) return toast(error.message);
  await loadProfile();
}

async function joinCouple(){
  const code = $('join-code').value.trim();
  if (!code) return toast('Colle le code d\'abord');
  const { data, error } = await sb.rpc('join_couple', { code });
  if (error || !data) return toast('Code invalide');
  toast('Vous êtes reliés 💞');
  await loadProfile();
}

function copyCode(){ navigator.clipboard?.writeText(profile.couple_id).then(() => toast('Code copié'), () => toast('Copie impossible, sélectionne-le')); }

async function loadMain(){
  show('main');
  $('hello').textContent = 'Salut ' + profile.display_name + ' !';
  $('date-label').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('couple-code').textContent = profile.couple_id;
  const d = today();
  const { data: ps } = await sb.from('profiles').select('*').neq('id', me.id);
  partner = (ps && ps[0]) || null;
  $('waiting').hidden = !!partner;

  const [{ data: e }, { data: des }] = await Promise.all([
    sb.from('daily_entries').select('*').eq('user_id', me.id).eq('entry_date', d).maybeSingle(),
    sb.from('desires').select('*').eq('user_id', me.id).eq('entry_date', d).maybeSingle()
  ]);
  selectedEmoji = e?.mood_emoji || null;
  renderEmojis();
  $('fait').value = e?.what_i_did || '';
  $('ressens').value = e?.how_i_feel || '';
  renderSliders(des);
  await Promise.all([loadQuestion(), loadPartner()]);
}

function renderEmojis(){
  $('emojis').innerHTML = EMOJIS.map(em => `<button class="${em === selectedEmoji ? 'on' : ''}" onclick="pickEmoji('${em}')">${em}</button>`).join('');
}
function pickEmoji(em){ selectedEmoji = em; renderEmojis(); }

function renderSliders(des){
  $('sliders').innerHTML = ENVIES.map(([k, l]) => {
    const v = des?.[k] ?? 50;
    return `<label class="slider"><span>${l}</span><b id="v-${k}">${v}%</b><input type="range" min="0" max="100" step="5" value="${v}" id="s-${k}" oninput="document.getElementById('v-${k}').textContent=this.value+'%'"></label>`;
  }).join('');
}

async function saveDay(){
  if (!selectedEmoji) return toast('Choisis un emoji 🙂');
  const { error } = await sb.from('daily_entries').upsert({ user_id: me.id, entry_date: today(), mood_emoji: selectedEmoji, what_i_did: $('fait').value.trim(), how_i_feel: $('ressens').value.trim() }, { onConflict: 'user_id,entry_date' });
  toast(error ? error.message : 'Journée enregistrée ✨');
}

async function saveEnvies(){
  const row = { user_id: me.id, entry_date: today(), updated_at: new Date().toISOString() };
  ENVIES.forEach(([k]) => row[k] = +$('s-' + k).value);
  const { error } = await sb.from('desires').upsert(row, { onConflict: 'user_id,entry_date' });
  toast(error ? error.message : 'Envies enregistrées 💫');
}

async function loadQuestion(){
  const { data: q } = await sb.from('questions').select('*').eq('question_date', today()).maybeSingle();
  question = q;
  if (!q) { $('q-text').textContent = 'Pas de question aujourd\'hui.'; $('q-form').hidden = true; $('q-answers').innerHTML = ''; return; }
  $('q-text').textContent = q.text;
  const { data: ans } = await sb.from('question_answers').select('*').eq('question_id', q.id);
  const mine = ans?.find(a => a.user_id === me.id);
  const theirs = ans?.find(a => a.user_id !== me.id);
  const pname = partner ? esc(partner.display_name) : 'ton ou ta partenaire';
  if (!mine) {
    $('q-form').hidden = false;
    $('q-answers').innerHTML = `<p class="muted">Réponds pour découvrir la réponse de ${pname} 🔒</p>`;
    return;
  }
  $('q-form').hidden = true;
  $('q-answers').innerHTML = `<div class="bubble me"><small>Toi</small>${esc(mine.answer)}</div>` +
    (theirs ? `<div class="bubble them"><small>${pname}</small>${esc(theirs.answer)}</div>` : `<p class="muted">En attente de la réponse de ${pname} ⏳</p>`);
}

async function answerQuestion(){
  const t = $('q-input').value.trim();
  if (!t || !question) return;
  const { error } = await sb.from('question_answers').insert({ question_id: question.id, user_id: me.id, answer: t });
  if (error) return toast(error.message);
  $('q-input').value = '';
  loadQuestion();
}

async function loadPartner(){
  if (!partner) { $('partner').hidden = true; return; }
  $('partner').hidden = false;
  $('p-title').textContent = 'La journée de ' + partner.display_name;
  const d = today();
  const [{ data: e }, { data: des }] = await Promise.all([
    sb.from('daily_entries').select('*').eq('user_id', partner.id).eq('entry_date', d).maybeSingle(),
    sb.from('desires').select('*').eq('user_id', partner.id).eq('entry_date', d).maybeSingle()
  ]);
  let h = e
    ? `<div class="big">${esc(e.mood_emoji)}</div>` +
      (e.what_i_did ? `<p><b>Fait :</b> ${esc(e.what_i_did)}</p>` : '') +
      (e.how_i_feel ? `<p><b>Ressenti :</b> ${esc(e.how_i_feel)}</p>` : '')
    : '<p class="muted">Pas encore remplie aujourd\'hui.</p>';
  if (des) h += ENVIES.map(([k, l]) => des[k] == null ? '' : `<div class="bar"><span>${l}</span><b>${des[k]}%</b><i style="--w:${des[k]}%"></i></div>`).join('');
  $('p-body').innerHTML = h;
}

init();
</script>
</body>
</html>
